document.addEventListener('click',function(e){var choice=e.target.closest('[data-status-choice]'),menu=document.getElementById('statusMenu');if(choice){var task=pendingTasks[Number(choice.dataset.statusChoice)];if(task){task.status=choice.dataset.statusValue;task.tone=choice.dataset.statusTone;menu.hidden=true;render();toast('Estado cambiado a '+task.status+'.')}return}var trigger=e.target.closest('[data-status-toggle]');if(trigger){if(!menu.hidden&&menu.dataset.open===trigger.dataset.statusToggle){menu.hidden=true;trigger.setAttribute('aria-expanded','false');return}var rect=trigger.getBoundingClientRect(),opts=[['En curso','yellow'],['Acabado','green'],['Detenido','red'],['Cancelado','gray']];menu.innerHTML=opts.map(function(opt){return '<button type="button" class="priority-option status-option-'+opt[1]+'" data-status-choice="'+trigger.dataset.statusToggle+'" data-status-value="'+opt[0]+'" data-status-tone="'+opt[1]+'">'+opt[0]+'</button>'}).join('');menu.style.minWidth=Math.max(132,rect.width)+'px';menu.style.left=Math.max(8,Math.min(rect.left,innerWidth-Math.max(132,rect.width)-8))+'px';menu.style.top=Math.max(8,Math.min(rect.bottom+4,innerHeight-150))+'px';menu.hidden=false;menu.dataset.open=trigger.dataset.statusToggle;trigger.setAttribute('aria-expanded','true');return}if(menu&&!e.target.closest('#statusMenu')){menu.hidden=true;document.querySelectorAll('[data-status-toggle]').forEach(function(button){button.setAttribute('aria-expanded','false')})}});
